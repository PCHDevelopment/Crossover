[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossover-sdk"
version = "0.0.0"
description = "Python SDK for the Crossover Room Protocol (REST and WebSocket)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "websockets>=13"]

[tool.setuptools]
packages = ["crossover_sdk"]

[tool.setuptools.package-data]
crossover_sdk = ["typed_api.pyi", "py.typed"]
