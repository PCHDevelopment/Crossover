services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: crossover
      POSTGRES_PASSWORD: crossover
      POSTGRES_DB: crossover
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossover"]
      interval: 2s
      retries: 15
  redis:
    image: redis:7
    ports:
      - "6379:6379"
