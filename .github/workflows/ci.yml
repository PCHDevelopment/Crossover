name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  check:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crossover
          POSTGRES_PASSWORD: crossover
          POSTGRES_DB: crossover
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U crossover"
          --health-interval 2s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://crossover:crossover@localhost:5432/crossover
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @crossover/server exec playwright-core install --with-deps chromium
      - run: docker pull node:22-bookworm-slim
      - run: docker build -f apps/egress-proxy/Dockerfile -t crossover-egress-proxy:test .
      - run: docker build -f apps/git-fetcher/Dockerfile -t crossover-git-fetcher:test .
      - run: docker run --rm --network none --entrypoint git crossover-git-fetcher:test --version
      - run: pnpm test

  workspace-benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: self-hosted
    continue-on-error: true
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crossover
          POSTGRES_PASSWORD: crossover
          POSTGRES_DB: crossover
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crossover"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://crossover:crossover@localhost:5432/crossover
      BENCH_OUTPUT: ${{ github.workspace }}/benchmark-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @crossover/workspace bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-benchmark
          path: benchmark-results.json
