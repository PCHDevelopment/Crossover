name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo_repo_url:
        description: "Public https repository for the compose rehearsal's demo repo (default: PCHDevelopment/crossover-demo)"
        required: false
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The required check is the last job, `check`, which needs the others. Everything it needs to know is
# whether each of them succeeded; a cancelled or skipped job is not a pass. The jobs run in parallel
# (T1553): `static` and `go` need no services, `test` is everything but the Chromium-backed web E2E,
# which runs in `web-e2e` on its own runner, so no Docker test is changing bridge networks under it.
jobs:
  # Is there anything but documentation in this pull request? Pushes to main, the nightly run and
  # manual runs always run everything. `static` runs either way, so Prettier still checks the docs.
  # (The filter is two plain lists, not one list with negations: the action ORs the patterns of a list,
  # so `**` with `!docs/**` would match every file.)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.result.outputs.code }}
    steps:
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          list-files: json
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/ISSUE_TEMPLATE/**'
            all:
              - '**'
      - id: result
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ steps.filter.outputs.all_files }}
          DOCS: ${{ steps.filter.outputs.docs_files }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            # Code changed if more files changed than the docs filter matched.
            code=$(jq -n --argjson all "${ALL:-[]}" --argjson docs "${DOCS:-[]}" '($all | length) > ($docs | length)')
            echo "changed files: $(jq -n --argjson all "${ALL:-[]}" '$all | length'), of which docs: $(jq -n --argjson docs "${DOCS:-[]}" '$docs | length')"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # `tsc -b` still runs and checks everything; the restored outputs and .tsbuildinfo files only let it
      # skip the projects whose sources did not change. Restored before `pnpm install`, so the hash below
      # does not scan node_modules. Only `static` saves it; the other jobs restore it.
      - uses: actions/cache@v4
        with:
          path: |
            apps/*/dist
            apps/*/tsconfig.tsbuildinfo
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
            plugins/*/dist
            plugins/*/tsconfig.tsbuildinfo
          key: ts-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ts-build-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # gen:wasm --check below needs the built packages.
      - run: pnpm typecheck
      # The authorization policy (D9) is Rego compiled to packages/policy/policy/policy.wasm, which is
      # committed together with the role bundles it is built from (policy/bundles.gen.rego, generated from
      # bundles.ts). A pinned, checksum-verified opa binary kept under the job's temp dir (nothing is
      # installed system-wide) runs the Rego unit tests and checks that the committed module and bundles are what
      # the sources build, so a changed policy cannot ship with an old module. The version also
      # appears in packages/policy/src/wasm-cli.ts.
      - name: Test the authorization policy (OPA)
        run: |
          set -euo pipefail
          version=1.21.2
          case "$(uname -m)" in
            x86_64) arch=amd64; sum=830ab11f61ffec760b5e19db0d7ad02bf037e13f5ef4d665faeaf17632177527 ;;
            aarch64) arch=arm64; sum=ed13bb8647b8a81e1f11741dd18babe02aced7a304314bd6bf8007793b6d4ff1 ;;
            *) echo "No pinned opa for $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/opa"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/opa" "https://github.com/open-policy-agent/opa/releases/download/v$version/opa_linux_${arch}_static"
          echo "$sum  $dir/opa" | sha256sum -c -
          chmod +x "$dir/opa"
          "$dir/opa" fmt --list --fail packages/policy/policy
          "$dir/opa" test packages/policy/policy
          OPA_BIN="$dir/opa" pnpm --filter @crossover/policy gen:wasm -- --check

  go:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          # go.sum is in clients/go, not at the repository root, where setup-go looks by default.
          cache-dependency-path: clients/go/go.sum
      - name: Test Go CLI
        working-directory: clients/go
        run: go test ./...
      # Cheap with the build cache, and it catches Windows- and macOS-only breaks on every PR.
      - name: Cross-compile Go CLI release binaries
        working-directory: clients/go
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=
            if [ "$os" = windows ]; then suffix=.exe; fi
            output="dist/room-${os}-${arch}${suffix}"
            echo "Building $output"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -buildvcs=false -trimpath -ldflags='-s -w' -o "$output" ./cmd/room
          done
      # Only a release uses the binaries, so pull requests don't upload them.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: room-cli-release
          path: clients/go/dist/room-*
          if-no-files-found: error

  # The Docker images the test jobs run against, built once (T1566), side by side. Both `test`
  # shards and `web-e2e` used to build the same images each; they now load these, so the tags and
  # the image IDs are the same ones. Each image is its own artifact, with a file holding its tag and
  # ID, so a job downloads only what it uses and can check what it loaded.
  images:
    name: images (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: egress-proxy, file: apps/egress-proxy/Dockerfile, target: "" }
          - { name: browser-plugin, file: plugins/browser/Dockerfile, target: test }
          - { name: git-fetcher, file: apps/git-fetcher/Dockerfile, target: "" }
          - { name: github-plugin, file: plugins/github/Dockerfile, target: "" }
          - { name: server, file: apps/server/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          tags: crossover-${{ matrix.name }}:test
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Save the image
        run: |
          out="$RUNNER_TEMP/save"
          mkdir -p "$out"
          tag="crossover-${{ matrix.name }}:test"
          id="$(docker image inspect "$tag" --format '{{.Id}}')"
          echo "built $tag $id"
          echo "$tag $id" > "$out/${{ matrix.name }}.id"
          docker save "$tag" | zstd -T0 -3 -q -o "$out/${{ matrix.name }}.tar.zst"
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/save/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 15
    # The main vitest run in two shards that run side by side; `check` needs the whole matrix.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crossover
          POSTGRES_PASSWORD: crossover
          POSTGRES_DB: crossover
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U crossover"
          --health-interval 2s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6380:6379
    env:
      # The service containers publish on 5434/6380 so they don't collide with a local Postgres or
      # Redis when this job runs on a developer's machine (for example with act); the URLs must use
      # the same ports.
      DATABASE_URL: postgres://crossover:crossover@localhost:5434/crossover
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4
      # `tsc -b` still runs and checks everything; the restored outputs and .tsbuildinfo files only let it
      # skip the projects whose sources did not change. Restored before `pnpm install`, so the hash below
      # does not scan node_modules. Only `static` saves it; the other jobs restore it.
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/*/dist
            apps/*/tsconfig.tsbuildinfo
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
            plugins/*/dist
            plugins/*/tsconfig.tsbuildinfo
          key: ts-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ts-build-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest orders the files it runs longest-first from the timings of the last run. CI never kept
      # them, so every run started its long files late. Each shard has its own file set and its own
      # timings; a run falls back to the newest ones from its own branch, then from main. This only
      # reorders files: which tests run does not depend on it.
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-results-${{ github.ref_name }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: |
            vitest-results-${{ github.ref_name }}-${{ strategy.job-index }}-
            vitest-results-main-${{ strategy.job-index }}-
      - run: pnpm typecheck
      # workspace.search runs ripgrep. A pinned, checksum-verified binary needs no sudo, so it works
      # on any runner.
      - name: Install ripgrep
        run: |
          if command -v rg >/dev/null; then rg --version | head -1; exit 0; fi
          case "$(uname -m)" in
            x86_64) target=x86_64-unknown-linux-musl; sum=4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e ;;
            aarch64) target=aarch64-unknown-linux-gnu; sum=c827481c4ff4ea10c9dc7a4022c8de5db34a5737cb74484d62eb94a95841ab2f ;;
            *) echo "No pinned ripgrep for $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/ripgrep"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/rg.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-$target.tar.gz"
          echo "$sum  $dir/rg.tar.gz" | sha256sum -c -
          tar -xzf "$dir/rg.tar.gz" -C "$dir" --strip-components=1
          echo "$dir" >> "$GITHUB_PATH"
      - run: docker pull node:22-bookworm-slim
      - run: docker pull node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
      - run: docker pull busybox:1.36.1-musl@sha256:3c6ae8008e2c2eedd141725c30b20d9c36b026eb796688f88205845ef17aa213
      # The images are built beside this job, not before it: install, restore and typecheck above
      # run while they build. Wait for exactly the ones this job loads; if one of them failed, so
      # does this job, now rather than at the end.
      - name: Wait for the images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: "egress-proxy browser-plugin git-fetcher github-plugin server"
        run: |
          # One failed API call is not a failed job: try again on the next pass, and give up only
          # after several in a row. Poll gently; the token's requests are shared by the repository.
          set -o pipefail
          deadline=$((SECONDS + 600))
          errors=0
          while :; do
            # Every attempt's jobs: "Re-run failed jobs" does not re-run an `images` job that
            # succeeded, so its result is in an earlier attempt. The newest attempt of each wins.
            if ! jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" --jq '.jobs[]' | jq -s '.')"; then
              errors=$((errors + 1))
              [ "$errors" -lt 6 ] || { echo "ERROR: the jobs API failed $errors times in a row"; exit 1; }
              [ "$SECONDS" -lt "$deadline" ] || { echo "ERROR: the images were not ready in 10 minutes"; exit 1; }
              sleep 10
              continue
            fi
            errors=0
            pending=0
            for name in $IMAGES; do
              result="$(echo "$jobs" | jq -r --arg n "images ($name)" '[.[] | select(.name == $n)] | sort_by(.run_attempt) | last | .conclusion // "pending"')"
              case "$result" in
                success) ;;
                pending|null) pending=1 ;;
                *) echo "ERROR: images ($name) finished as $result"; exit 1 ;;
              esac
            done
            [ "$pending" -eq 0 ] && break
            [ "$SECONDS" -lt "$deadline" ] || { echo "ERROR: the images were not ready in 10 minutes"; exit 1; }
            sleep 10
          done
          echo "images ready after ${SECONDS}s of this step"
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load the test images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: "egress-proxy browser-plugin git-fetcher github-plugin server"
        run: |
          # Each image must have the ID it had where it was built: the tags are the ones the tests
          # use, and the content must be too.
          shopt -s nullglob
          dir="$RUNNER_TEMP/images"
          # download-artifact has finished "successfully" with one image missing or cut short (a
          # 482 MB file, zstd: "premature end"). Check each image file and fetch a bad one again,
          # up to three times. The saved images are kept for a day: "Re-run failed jobs" re-runs this
          # job but not the `images` jobs that succeeded, and finds nothing once they have expired.
          for name in $IMAGES; do
            for attempt in 1 2 3; do
              if [ -f "$dir/$name.tar.zst" ] && [ -f "$dir/$name.id" ] && zstd -t -q "$dir/$name.tar.zst"; then break; fi
              [ "$attempt" -lt 3 ] || { echo "ERROR: the saved image $name is missing or damaged after 3 downloads; it expires after a day, so if it has, re-run all jobs"; exit 1; }
              echo "The saved image $name is missing or damaged (try $attempt); downloading it again"
              rm -f "$dir/$name.tar.zst" "$dir/$name.id"
              gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-$name" --dir "$dir" || true
            done
          done
          files=("$dir"/*.tar.zst)
          for file in "${files[@]}"; do zstd -dc "$file" | docker load; done
          for file in "$dir"/*.id; do
            read -r tag expected < "$file"
            actual="$(docker image inspect "$tag" --format '{{.Id}}')"
            echo "loaded $tag $actual"
            [ "$actual" = "$expected" ] || { echo "ERROR: $tag is $actual here but $expected where it was built"; exit 1; }
          done
      - name: Smoke test GitHub plugin stdin/stdout with network disabled
        shell: bash
        run: |
          image_id="$(docker image inspect crossover-github-plugin:test --format '{{.Id}}')"
          echo "Built immutable GitHub worker image $image_id"
          set +e
          output="$(printf '%s\n' '{"invocation":{"tool":"github.read_repository","scope":"acme/widgets","args":{"repo":"acme/widgets"}}}' | docker run --rm -i --network=none -e GITHUB_TOKEN=fixture-token crossover-github-plugin:test)"
          status=$?
          set -e
          test "$status" -eq 1
          printf '%s\n' "$output" | node --input-type=module -e 'let input="";for await(const chunk of process.stdin)input+=chunk;const value=JSON.parse(input);if(value.error?.code!=="unavailable"||input.includes("fixture-token"))process.exit(1);'
      - run: docker run --rm --network none --entrypoint git crossover-git-fetcher:test --version
      - name: Test, including deployed server topology
        run: pnpm exec vitest run --exclude apps/server/src/e2e/web.test.ts --shard=${{ matrix.shard }}
        env:
          CROSSOVER_SERVER_IMAGE: crossover-server:test

  # The Chromium-backed web E2E (the only Playwright user), on its own runner.
  web-e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crossover
          POSTGRES_PASSWORD: crossover
          POSTGRES_DB: crossover
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U crossover"
          --health-interval 2s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6380:6379
    env:
      # The service containers publish on 5434/6380 so they don't collide with a local Postgres or
      # Redis when this job runs on a developer's machine (for example with act); the URLs must use
      # the same ports.
      DATABASE_URL: postgres://crossover:crossover@localhost:5434/crossover
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4
      # `tsc -b` still runs and checks everything; the restored outputs and .tsbuildinfo files only let it
      # skip the projects whose sources did not change. Restored before `pnpm install`, so the hash below
      # does not scan node_modules. Only `static` saves it; the other jobs restore it.
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/*/dist
            apps/*/tsconfig.tsbuildinfo
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
            plugins/*/dist
            plugins/*/tsconfig.tsbuildinfo
          key: ts-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ts-build-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @crossover/server exec node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      # The browser download is cached; the system libraries (apt) are not.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      # --with-deps installs Chromium's system libraries through sudo. Hosted runners allow it; where
      # sudo needs a password, the libraries must already be on the machine.
      - name: Install Chromium
        run: |
          if sudo -n true 2>/dev/null; then
            pnpm --filter @crossover/server exec playwright-core install --with-deps chromium
          else
            pnpm --filter @crossover/server exec playwright-core install chromium
          fi
      # web-fixture.ts runs health checks and a git fetcher in Docker.
      - run: docker pull node:22-bookworm-slim
      - run: docker pull node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
      # The images are built beside this job, not before it: install, restore and typecheck above
      # run while they build. Wait for exactly the ones this job loads; if one of them failed, so
      # does this job, now rather than at the end.
      - name: Wait for the images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: "git-fetcher"
        run: |
          # One failed API call is not a failed job: try again on the next pass, and give up only
          # after several in a row. Poll gently; the token's requests are shared by the repository.
          set -o pipefail
          deadline=$((SECONDS + 600))
          errors=0
          while :; do
            # Every attempt's jobs: "Re-run failed jobs" does not re-run an `images` job that
            # succeeded, so its result is in an earlier attempt. The newest attempt of each wins.
            if ! jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" --jq '.jobs[]' | jq -s '.')"; then
              errors=$((errors + 1))
              [ "$errors" -lt 6 ] || { echo "ERROR: the jobs API failed $errors times in a row"; exit 1; }
              [ "$SECONDS" -lt "$deadline" ] || { echo "ERROR: the images were not ready in 10 minutes"; exit 1; }
              sleep 10
              continue
            fi
            errors=0
            pending=0
            for name in $IMAGES; do
              result="$(echo "$jobs" | jq -r --arg n "images ($name)" '[.[] | select(.name == $n)] | sort_by(.run_attempt) | last | .conclusion // "pending"')"
              case "$result" in
                success) ;;
                pending|null) pending=1 ;;
                *) echo "ERROR: images ($name) finished as $result"; exit 1 ;;
              esac
            done
            [ "$pending" -eq 0 ] && break
            [ "$SECONDS" -lt "$deadline" ] || { echo "ERROR: the images were not ready in 10 minutes"; exit 1; }
            sleep 10
          done
          echo "images ready after ${SECONDS}s of this step"
      - uses: actions/download-artifact@v4
        with:
          pattern: image-git-fetcher
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load the git-fetcher image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: "git-fetcher"
        run: |
          # Each image must have the ID it had where it was built: the tags are the ones the tests
          # use, and the content must be too.
          shopt -s nullglob
          dir="$RUNNER_TEMP/images"
          # download-artifact has finished "successfully" with one image missing or cut short (a
          # 482 MB file, zstd: "premature end"). Check each image file and fetch a bad one again,
          # up to three times. The saved images are kept for a day: "Re-run failed jobs" re-runs this
          # job but not the `images` jobs that succeeded, and finds nothing once they have expired.
          for name in $IMAGES; do
            for attempt in 1 2 3; do
              if [ -f "$dir/$name.tar.zst" ] && [ -f "$dir/$name.id" ] && zstd -t -q "$dir/$name.tar.zst"; then break; fi
              [ "$attempt" -lt 3 ] || { echo "ERROR: the saved image $name is missing or damaged after 3 downloads; it expires after a day, so if it has, re-run all jobs"; exit 1; }
              echo "The saved image $name is missing or damaged (try $attempt); downloading it again"
              rm -f "$dir/$name.tar.zst" "$dir/$name.id"
              gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-$name" --dir "$dir" || true
            done
          done
          files=("$dir"/*.tar.zst)
          for file in "${files[@]}"; do zstd -dc "$file" | docker load; done
          for file in "$dir"/*.id; do
            read -r tag expected < "$file"
            actual="$(docker image inspect "$tag" --format '{{.Id}}')"
            echo "loaded $tag $actual"
            [ "$actual" = "$expected" ] || { echo "ERROR: $tag is $actual here but $expected where it was built"; exit 1; }
          done
      - name: Test the web app in a browser
        run: pnpm exec vitest run apps/server/src/e2e/web.test.ts

  check:
    if: always()
    needs: [changes, static, go, images, test, web-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded, or the code jobs to have been skipped for a docs-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          code=$(echo "$NEEDS" | jq -r '.changes.outputs.code // "unknown"')
          echo "code changed: $code"
          # `changes` and `static` always run and must succeed.
          echo "$NEEDS" | jq -e '.changes.result == "success" and .static.result == "success"' > /dev/null
          if [ "$code" = true ]; then
            # Everything must have succeeded: a skipped, cancelled or failed job is not a pass.
            echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
          elif [ "$code" = false ]; then
            # Only the filter may have skipped them: a docs-only change. Anything else is not a pass.
            echo "$NEEDS" | jq -e '.go.result == "skipped" and .images.result == "skipped" and .test.result == "skipped" and .["web-e2e"].result == "skipped"' > /dev/null
          else
            echo "The changes job did not report"; exit 1
          fi

  # The nightly rehearsal of docs/DEMO-RUNBOOK.md against the real `docker compose` stack (T1570).
  # It runs on the schedule and by hand only, never on pull requests or pushes, and `check` does not
  # wait for it. A red run is reported on #314 by whoever sees it, with the failing step.
  compose-rehearsal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEMO_REPO_URL: ${{ inputs.demo_repo_url || 'https://github.com/PCHDevelopment/crossover-demo' }}
      REHEARSAL_OUT: ${{ github.workspace }}/rehearsal-out
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: clients/go/go.sum
      - run: pnpm install --frozen-lockfile
      # Runbook section 1, as written. The secret is generated here, masked, and never printed.
      - name: Prepare the stack
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)/" .env
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "GIT_INTERNAL_TOKEN_SECRET=$secret" >> "$GITHUB_ENV"
          printf 'GIT_INTERNAL_TOKEN_SECRET=%s\n' "$secret" >> .env
          docker network create --internal crossover-git
          docker build -f apps/git-fetcher/Dockerfile -t crossover-git-fetcher:latest .
          docker pull node:22-bookworm-slim
          sudo install -d -o 1000 -g 1000 -m 0750 "$PWD/.data/workspaces"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' node:22-bookworm-slim)"
          printf 'services:\n  server:\n    environment:\n      AWS_PLUGIN_IMAGE: %s\n' "$digest" > docker-compose.override.yml
      - name: Build the agent CLI
        working-directory: clients/go
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -o room ./cmd/room
          sudo install room /usr/local/bin/
      - name: Start the stack
        run: |
          set -euo pipefail
          start=$SECONDS
          docker compose --profile server up --build -d
          echo "built and started in $((SECONDS - start)) s"
          healthy=$SECONDS
          until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)" = 200 ]; do
            if [ $((SECONDS - healthy)) -ge 180 ]; then
              echo "ERROR: GET /health was not 200 within 180 s of starting the stack"
              docker compose logs --no-color --tail 200 server
              exit 1
            fi
            sleep 2
          done
          echo "GET /health 200 after $((SECONDS - healthy)) s"
      # The rehearsal imports @crossover/sdk, which resolves to its build output.
      - name: Build the SDK and typecheck the rehearsal
        run: pnpm exec tsc -b scripts/compose-rehearsal
      - name: Rehearse the runbook
        run: pnpm exec vitest run --config vitest.rehearsal.config.ts
      # Git's own complaint is not in the server log (by design), so on a failure look at what the
      # server's user sees on the workspace volume. Nothing here prints a secret.
      - name: Diagnose a failed rehearsal
        if: failure()
        run: |
          docker exec crossover-server sh -c '
            id; git --version; echo "WORKSPACE_ROOT=$WORKSPACE_ROOT"
            ls -lan "$WORKSPACE_ROOT" | head -8
            for d in "$WORKSPACE_ROOT"/*; do
              echo "== $d"; ls -lan "$d" | head -6
              git --git-dir="$d" rev-parse --git-dir 2>&1 | head -3
              git -C "$d" rev-parse --git-dir 2>&1 | head -3
            done' 2>&1 | head -60 || true
      # Only after the rehearsal's own check that no generated secret or issued token is in the logs.
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('rehearsal-out/leak-check.ok') != ''
        with:
          name: compose-rehearsal
          path: rehearsal-out
          retention-days: 7
          if-no-files-found: error
      - name: Clean up
        if: always()
        run: |
          docker compose --profile server down -v --remove-orphans || true
          docker ps -aq --filter label=crossover.sandbox=true | xargs -r docker rm -f || true
          docker volume ls -q --filter name=crossover-sbx- | xargs -r docker volume rm || true
          docker network ls -q --filter name=crossover-net- | xargs -r docker network rm || true
          docker network rm crossover-git || true
          sudo rm -rf .data .env docker-compose.override.yml

  workspace-benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crossover
          POSTGRES_PASSWORD: crossover
          POSTGRES_DB: crossover
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U crossover"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://crossover:crossover@localhost:5434/crossover
      BENCH_OUTPUT: ${{ github.workspace }}/benchmark-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @crossover/workspace bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-benchmark
          path: benchmark-results.json
